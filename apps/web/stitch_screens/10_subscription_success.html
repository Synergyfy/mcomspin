<!-- Script for Confetti Logic -->
<script>
        function createConfetti() {
            const colors = ['#a23f00', '#ff9969', '#00629f', '#97471d', '#fc6700'];
            const container = document.body;
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                container.appendChild(confetti);

                // Remove element after animation ends to clean up DOM
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }

        // Trigger on load
        window.addEventListener('load', createConfetti);
        
        // Re-trigger on main action for "Dopamine-driven" engagement
        document.querySelector('button.bg-primary').addEventListener('click', (e) => {
            e.preventDefault();
            createConfetti();
            setTimeout(() => {
                alert("Redirecting to your Onboarding journey...");
            }, 1000);
        });
    </script>
