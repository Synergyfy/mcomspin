<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Campaign - MCOMSpin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .btn-press-effect {
            box-shadow: 0 4px 0 0 #7b2f00;
        }
        .btn-press-effect:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #7b2f00;
        }
        .glass-counter {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(162, 63, 0, 0.1);
        }
        .custom-shadow {
            box-shadow: 0 10px 20px -10px rgba(53, 16, 0, 0.15);
        }
        .peg-dot {
            width: 4px;
            height: 4px;
            background-color: #5a4136;
            opacity: 0.1;
            border-radius: 50%;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#f8ddd2",
                        "on-surface-variant": "#5a4136",
                        "on-error": "#ffffff",
                        "on-surface": "#261812",
                        "on-secondary-fixed": "#351000",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ffeae1",
                        "outline-variant": "#e2bfb1",
                        "error-container": "#ffdad6",
                        "tertiary": "#00629f",
                        "surface-bright": "#fff8f6",
                        "secondary-container": "#ff9969",
                        "inverse-surface": "#3d2d26",
                        "tertiary-container": "#009cf8",
                        "on-background": "#261812",
                        "surface-container-low": "#fff1eb",
                        "on-primary-fixed": "#351000",
                        "inverse-primary": "#ffb695",
                        "tertiary-fixed": "#cfe4ff",
                        "on-primary-container": "#541d00",
                        "on-tertiary-container": "#003152",
                        "primary-fixed-dim": "#ffb695",
                        "on-secondary-fixed-variant": "#793106",
                        "inverse-on-surface": "#ffede6",
                        "error": "#ba1a1a",
                        "background": "#fff8f6",
                        "surface-container-high": "#fee3d8",
                        "on-primary-fixed-variant": "#7b2f00",
                        "primary-container": "#fc6700",
                        "outline": "#8e7164",
                        "secondary-fixed": "#ffdbcc",
                        "on-tertiary-fixed-variant": "#004a79",
                        "surface": "#fff8f6",
                        "primary-fixed": "#ffdbcc",
                        "on-primary": "#ffffff",
                        "secondary": "#97471d",
                        "on-tertiary": "#ffffff",
                        "primary": "#a23f00",
                        "on-tertiary-fixed": "#001d34",
                        "surface-tint": "#a23f00",
                        "surface-dim": "#efd5ca",
                        "tertiary-fixed-dim": "#9acbff",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#ffb694",
                        "on-secondary-container": "#772f05",
                        "surface-variant": "#f8ddd2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "section-padding": "40px",
                        "stack-md": "16px",
                        "base": "8px",
                        "stack-sm": "8px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24">
<!-- Top AppBar (From Shared Components JSON) -->
<header class="bg-surface dark:bg-surface shadow-[0_10px_20px_-10px_rgba(53,16,0,0.15)] w-full top-0 sticky flex justify-between items-center px-container-margin py-base z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="business_logo">business_center</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">MCOMSpin</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</button>
</header>
<main class="flex-grow w-full max-w-2xl mx-auto px-container-margin pt-stack-md">
<!-- Step Indicator -->
<div class="mb-stack-lg">
<div class="flex justify-between items-end mb-base">
<div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Step 1 of 4</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Campaign Information</h2>
</div>
<div class="glass-counter px-4 py-2 rounded-full border border-primary/10 shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="token" style="font-variation-settings: 'FILL' 1;">token</span>
<span class="font-label-md text-label-md text-primary">250 Drops</span>
</div>
</div>
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full w-1/4 transition-all duration-500 ease-out shadow-[0_0_8px_rgba(162,63,0,0.5)]"></div>
</div>
</div>
<!-- Progress Track Details (Implicit Context) -->
<div class="grid grid-cols-4 gap-2 mb-stack-lg">
<div class="h-1 rounded-full bg-primary"></div>
<div class="h-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 rounded-full bg-surface-container-highest"></div>
<div class="h-1 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Campaign Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-md custom-shadow border border-surface-container-high relative overflow-hidden">
<!-- Decorative Peg Pattern -->
<div class="absolute top-4 right-4 grid grid-cols-3 gap-2 opacity-20">
<div class="peg-dot"></div><div class="peg-dot"></div><div class="peg-dot"></div>
<div class="peg-dot"></div><div class="peg-dot"></div><div class="peg-dot"></div>
</div>
<form class="space-y-stack-md relative z-10">
<!-- Campaign Name -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block px-1" for="campaign-name">Campaign Name</label>
<input class="w-full h-14 px-4 rounded-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-white transition-all outline-none text-on-surface font-body-md" id="campaign-name" placeholder="e.g. Summer Solstice Grand Drop" type="text"/>
</div>
<!-- Campaign Description -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block px-1" for="campaign-desc">Description</label>
<textarea class="w-full p-4 rounded-lg bg-surface-container-low border-2 border-transparent focus:border-primary focus:bg-white transition-all outline-none text-on-surface font-body-md resize-none" id="campaign-desc" placeholder="Describe the excitement! What can customers win?" rows="4"></textarea>
</div>
<!-- Asset Upload Section -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Banner Upload -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block px-1">Campaign Banner</label>
<div class="group relative flex flex-col items-center justify-center w-full aspect-video rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant hover:border-primary hover:bg-surface-container-highest transition-all cursor-pointer overflow-hidden">
<span class="material-symbols-outlined text-primary mb-2" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Upload Banner (16:9)</span>
<input class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Thumbnail Upload -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block px-1">Thumbnail</label>
<div class="group relative flex flex-col items-center justify-center w-full aspect-square md:aspect-video rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant hover:border-primary hover:bg-surface-container-highest transition-all cursor-pointer overflow-hidden">
<span class="material-symbols-outlined text-primary mb-2" data-icon="image">image</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Upload Square</span>
<input class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</div>
</div>
</form>
</div>
<!-- Sticky Bottom Actions (Mobile Focused) -->
<div class="fixed bottom-0 left-0 right-0 p-container-margin bg-gradient-to-t from-background via-background/95 to-transparent z-40">
<div class="max-w-2xl mx-auto flex flex-col gap-3">
<button class="w-full h-14 bg-primary text-white font-label-md rounded-full btn-press-effect flex items-center justify-center gap-2 hover:bg-secondary transition-colors uppercase tracking-widest">
                    Continue
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full h-12 bg-transparent text-primary font-label-md rounded-full border-2 border-primary/20 flex items-center justify-center gap-2 hover:bg-surface-container-low transition-all active:scale-95 duration-100">
                    Save Draft
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation (Shared Component Logic - Filtered for Task Focus) -->
<!-- Note: Suppression logic applied - Hidden for focused "Task Flow" as per Brand Anchors -->
<script>
        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple Drag & Drop Visual State
        const uploadZones = document.querySelectorAll('.group');
        uploadZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('bg-primary-container', 'border-primary');
            });
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('bg-primary-container', 'border-primary');
            });
        });
    </script>
</body></html>
