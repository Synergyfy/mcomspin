<script>
        // Simple micro-interaction for checkboxes
        const cards = document.querySelectorAll('label');
        cards.forEach(card => {
            const checkbox = card.querySelector('input');
            const checkIcon = card.querySelector('.material-symbols-outlined.text-white');
            const innerContainer = card.querySelector('.bg-surface-container-lowest');
            
            const updateState = () => {
                if (checkbox.checked) {
                    checkIcon.style.display = 'block';
                } else {
                    checkIcon.style.display = 'none';
                }
            };
            
            checkbox.addEventListener('change', updateState);
            updateState();
        });
    </script>
